[package]
name = "ghostshell_patterns"
version = "0.1.0"
edition = "2024"

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
thiserror = "2.0"
anyhow = "1.0"
